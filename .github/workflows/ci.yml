name: Enterprise Procurement Engine CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pydantic fastapi uvicorn click

    - name: Run Master Verification Suite (Validation, Audit Benchmark, Reproducibility)
      run: |
        python run_tests.py

    - name: Run Live Workflow Simulator
      run: |
        python simulate_workflow.py

    - name: Compute Operational Metrics & Savings
      run: |
        python -m src.cli metrics

